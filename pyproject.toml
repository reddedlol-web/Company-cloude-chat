[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "company-cloude-chat"
version = "0.1.0"
description = "Corporate Telegram knowledge bot with RAG"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13,<4",
    "apscheduler>=3.10,<4",
    "chromadb>=0.5,<1",
    "httpx>=0.27,<1",
    "langchain-text-splitters>=0.3,<1",
    "pydantic-settings>=2.5,<3",
    "pypdf>=5.0,<6",
]

[project.optional-dependencies]
dashboard = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-mock>=3.14,<4",
]

[project.scripts]
company-bot = "src.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
